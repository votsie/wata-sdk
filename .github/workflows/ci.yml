name: CI

on:
  push:
    branches: [main]
  pull_request:

# Каждый SDK проверяется независимо: поломка одного языка не должна прятать
# состояние остальных, поэтому fail-fast не используется.
jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - run: npm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev,webhooks]"
      - run: python -m pytest -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go vet ./...
      - run: go test ./...

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build --nologo
      - run: dotnet test --nologo

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна вся история: секрет, удалённый последним коммитом, остаётся в ней.
          fetch-depth: 0
      - name: Проверка на утечку секретов
        run: |
          # Репозиторий публичный: токены и ключи не должны попасть ни в дерево,
          # ни в историю коммитов.
          PATTERN='eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(WATA_[A-Z_]*TOKEN|WATA_PASSWORD|WATA_COOKIE)=[^[:space:]"'"'"']+'

          # Массив, а не строка: pathspec-исключения содержат ":!" и при подстановке
          # обычной переменной bash попытается выполнить их как команду.
          EXCLUDE=(':!*.example' ':!.github/workflows/ci.yml' ':!docs/SPEC.md')

          echo "Рабочее дерево..."
          if git grep -nE "$PATTERN" -- . "${EXCLUDE[@]}"; then
            echo "::error::Найдены значения, похожие на секреты, в рабочем дереве"
            exit 1
          fi

          echo "История коммитов..."
          if git grep -nE "$PATTERN" $(git rev-list --all) -- . "${EXCLUDE[@]}"; then
            echo "::error::Найдены значения, похожие на секреты, в истории коммитов"
            exit 1
          fi

          echo "Секретов не найдено"
